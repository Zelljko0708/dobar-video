<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101010">
    <title>DOBAR VIDEO – Studio za sve</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎬 DOBAR VIDEO</h1>
        <p>Studio za sve – besplatno!</p>
    </header>

    <main>
        <section>
            <h2>Izaberi svoj video</h2>
            <input type="file" id="videoFile" accept="video/*">

            <div id="videoContainer" style="position:relative; width:100%; overflow:hidden;">
                <video id="video" controls playsinline style="display:none; width:100%;"></video>
                <div id="videoText" style="position:absolute; top:25px; left:5%; right:5%; z-index:10; color:white; font-size:26px; font-weight:bold; text-align:center; text-shadow:2px 2px 4px black; pointer-events:none;"></div>
            </div>

            <h2>Dodaj tekst preko videa</h2>
            <textarea id="caption" placeholder="Napiši nešto smiješno..."></textarea>

            <h3>Veličina teksta</h3>
            <input type="range" id="textSize" min="16" max="60" value="26">
        </section>
    </main>

    <footer>
        <p>Napravljen za sve koji vole stvarati. ❤️</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
